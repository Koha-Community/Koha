---
/sip2/accounts:
  get:
    x-mojo-to: SIP2::Accounts#list
    operationId: listSip2Accounts
    tags:
      - sip2_accounts
    summary: List accounts
    produces:
      - application/json
    parameters:
      - description: Case insensitive search on account sip_account_id
        in: query
        name: sip_account_id
        required: false
        type: string
      - name: x-koha-embed
        in: header
        required: false
        description: Embed list sent as a request header
        type: array
        items:
          type: string
          enum:
            - institution
            - custom_item_fields
            - item_fields
            - custom_patron_fields
            - patron_attributes
            - screen_msg_regexs
            - sort_bin_mappings
            - system_preference_overrides
        collectionFormat: csv
      - $ref: "../swagger.yaml#/parameters/match"
      - $ref: "../swagger.yaml#/parameters/order_by"
      - $ref: "../swagger.yaml#/parameters/page"
      - $ref: "../swagger.yaml#/parameters/per_page"
      - $ref: "../swagger.yaml#/parameters/q_param"
      - $ref: "../swagger.yaml#/parameters/q_body"
    responses:
      200:
        description: A list of SIP2 accounts
        schema:
          items:
            $ref: "../swagger.yaml#/definitions/sip2_account"
          type: array
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

            * `invalid_query`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      403:
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      500:
        description: |-
          Internal server error. Possible `error_code` attribute values:
          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      503:
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        sip2: manage_sip2
  post:
    x-mojo-to: SIP2::Accounts#add
    operationId: addSip2Accounts
    tags:
      - sip2_accounts
    summary: Add accounts
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - description: A JSON object containing information about the new account
        in: body
        name: body
        required: true
        schema:
            $ref: "../swagger.yaml#/definitions/sip2_account"
    responses:
      201:
        description: A successfully created account
        schema:
          items:
            $ref: "../swagger.yaml#/definitions/sip2_account"
      400:
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      401:
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      403:
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      404:
        description: Ressource not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      409:
        description: Conflict in creating resource
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      413:
        description: Payload too large
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      500:
        description: |-
          Internal server error. Possible `error_code` attribute values:
          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      503:
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        sip2: manage_sip2
