"/sip2/accounts/{sip_account_id}/test_message":
  post:
    x-mojo-to: SIP2::Accounts#test_message
    operationId: testSip2AccountMessage
    tags:
      - sip2_accounts
    summary: Generate a SIP2 response for testing
    description: >
      Generates the SIP2 response a saved account would return for the given
      message, without going through a real SIP session and without needing the
      SIP account password. The message is handled in a transaction that is
      rolled back, so database changes are undone. Plugin hooks still run. A
      patron password is never checked: GOOD stands for a password that matches
      and BAD for one that does not. Only patrons the logged in user can see may
      be used, and when IndependentBranches is enabled, only items from the
      logged in user's library. Every test is logged.
    consumes:
      - application/json
    produces:
      - application/json
    parameters:
      - $ref: "../swagger.yaml#/parameters/sip_account_id_pp"
      - name: body
        in: body
        description: A JSON object describing the message to generate
        required: true
        schema:
          type: object
          properties:
            message:
              type: string
              description: The message to generate
              enum:
                - patron_status
                - patron_information
                - item_information
                - checkout
                - checkin
            patron_id:
              type: string
              description: The patron barcode to test with
            item_id:
              type: string
              description: The item barcode to test with
            patron_password:
              type: string
              description: >
                Whether the patron password counts as correct. The password
                itself is never checked, a real one is refused.
              enum:
                - GOOD
                - BAD
            summary:
              type: string
              description: >
                The list of items a patron information message asks for in the
                response. Without it the lists are left out.
              enum:
                - hold_items
                - overdue_items
                - charged_items
                - fine_items
                - recall_items
                - unavailable_holds
            request:
              type: string
              description: A raw SIP2 request string to run as-is instead of building one
          additionalProperties: false
    responses:
      200:
        description: The generated SIP2 message and response
        schema:
          type: object
          properties:
            request:
              type: string
              description: The raw SIP2 request that was run
            response:
              type: string
              description: The raw SIP2 response that was generated
            fixed:
              type: string
              description: The message code and fixed length portion of the response
            fields:
              type: array
              description: The variable length fields of the response
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: The two character field identifier
                  value:
                    type: string
                    description: The field value
          additionalProperties: false
      400:
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      401:
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      403:
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      404:
        description: Resource not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      500:
        description: |-
          Internal server error. Possible `error_code` attribute values:
          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      503:
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        sip2: test_sip2_messages
        borrowers: list_borrowers
