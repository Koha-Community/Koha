---
"/checkins/availability":
  get:
    x-mojo-to: Checkins#get_availability
    operationId: availabilityCheckins
    tags:
      - checkins
    summary: Get checkin availability
    description: |
      EXPERIMENTAL - DO NOT RELY on this, it is subject to change!

      Returns what a check-in of the item would require: blockers, which
      prevent it, and confirmations, which staff need to acknowledge. When
      confirmations are needed, a `confirmation_token` is returned, to be
      passed to `POST /checkins`.
    parameters:
      - name: item_id
        in: query
        description: Internal item identifier
        required: true
        type: integer
      - name: library_id
        in: query
        description: Internal library identifier. Defaults to the logged in library
        required: false
        type: string
    produces:
      - application/json
    responses:
      "200":
        description: Checkin availability information
        schema:
          $ref: "../swagger.yaml#/definitions/checkin_availability"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

          * `invalid_parameter_value` - Unknown library_id
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: |
          Access forbidden. Possible `error_code` attribute values:

          * `library_not_allowed` - The user cannot act on library_id (IndependentBranches)
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Item not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
/checkins:
  post:
    x-mojo-to: Checkins#add
    operationId: addCheckin
    tags:
      - checkins
    summary: Check in (return) an item
    description: |
      EXPERIMENTAL - DO NOT RELY on this, it is subject to change!

      Exactly one of `item_id` or `external_id` must be provided.
      Passing both simultaneously is not allowed.

      When the check-in needs confirmations, a 412 response is returned with
      a `confirmation_token`, to be passed back in the `confirmation` query
      parameter. This is a workflow gate, so staff acknowledge the
      situation, not an authorization control: any user allowed to check in
      items can obtain a token from `GET /checkins/availability`.

      A check-in of an item that was not checked out is recorded, with a
      null `checkout_id`.
    parameters:
      - name: body
        in: body
        description: A JSON object containing checkin information
        required: true
        schema:
          type: object
          properties:
            item_id:
              type: integer
              description: Internal item identifier. Mutually exclusive with external_id.
            external_id:
              type: string
              description: Item barcode. Mutually exclusive with item_id.
            library_id:
              type: string
              description: Library where the return takes place. Defaults to the logged in library
            exempt_fine:
              type: boolean
              description: Exempt fines on this return
            return_date:
              type: string
              description: Override return date (ISO 8601 date-time). Requires SpecifyReturnDate
            dropbox_mode:
              type: boolean
              description: Use book drop mode (calculate return date as last open day)
          additionalProperties: false
      - name: confirmation
        in: query
        description: A JWT confirmation token
        required: false
        type: string
      - name: x-koha-embed
        in: header
        required: false
        description: Embed list sent as a request header
        type: array
        items:
          type: string
          enum:
            - checkout
            - claim
            - credits
            - debits
            - desk
            - hold
            - item
            - item.biblio
            - library
            - recall
            - restriction
            - transfer
            - user
        collectionFormat: csv
    consumes:
      - application/json
    produces:
      - application/json
    responses:
      "200":
        description: Item checked in
        schema:
          $ref: "../swagger.yaml#/definitions/checkin"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

          * `missing_item_identifier` - Neither item_id nor external_id provided
          * `mutually_exclusive_parameters` - Both item_id and external_id provided
          * `invalid_parameter_value` - Unknown library_id, or return_date that cannot be parsed
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: |
          Checkin blocked or forbidden. Possible `error_code` attribute values:

          * `checkin_blocked` - Item has blockers preventing checkin.
            Possible keys in the `blockers` object:
            - `blocked_withdrawn` - Item is withdrawn (BlockReturnOfWithdrawnItems enabled)
            - `blocked_lost` - Item is lost (BlockReturnOfLostItems enabled)
            - `wrong_branch` - Item cannot be returned at this branch (AllowReturnToBranch policy).
              Value is an object with `wrong_branch` and `right_branch` keys.
          * `no_permission_for_exempt_fine` - updatecharges.writeoff permission required
          * `return_date_not_allowed` - Return date override requires the SpecifyReturnDate preference
          * `library_not_allowed` - The user cannot act on library_id (IndependentBranches)
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Item not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "409":
        description: |
          Conflict. Possible `error_code` attribute values:

          * `item_without_barcode` - The item has no barcode, it cannot be checked in
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "412":
        description: |
          Confirmation required. Possible `error_code` attribute values:

          * `confirmation_required` - Staff must confirm before checkin proceeds.
            Response includes a `confirmation_token` JWT to pass back on retry.
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
