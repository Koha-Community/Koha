---
/library_groups:
  get:
    x-mojo-to: LibraryGroups#list
    operationId: listLibraryGroups
    tags:
      - library_groups
    summary: List library groups
    parameters:
      - name: parent_id
        in: query
        description: Internal identifier of the parent library group
        required: false
        type: integer
      - name: library_id
        in: query
        description: Internal identifier of the member library
        required: false
        type: string
      - name: title
        in: query
        description: title of the library group
        required: false
        type: string
      - name: description
        in: query
        description: description of the library group
        required: false
        type: string
      - name: hide_patron_info
        in: query
        description: If patron information is hidden from staff outside the group
        required: false
        type: integer
      - name: limit_item_editing
        in: query
        description: If item editing is limited to staff within the group
        required: false
        type: integer
      - name: is_opac_search_group
        in: query
        description: If the group is used as an OPAC search group
        required: false
        type: integer
      - name: is_staff_search_group
        in: query
        description: If the group is used as a staff interface search group
        required: false
        type: integer
      - name: is_local_hold_group
        in: query
        description: If the group is used as a local hold group
        required: false
        type: integer
      - name: is_local_float_group
        in: query
        description: If the group is used as a local float group
        required: false
        type: integer
      - $ref: "../swagger.yaml#/parameters/match"
      - $ref: "../swagger.yaml#/parameters/order_by"
      - $ref: "../swagger.yaml#/parameters/page"
      - $ref: "../swagger.yaml#/parameters/per_page"
      - $ref: "../swagger.yaml#/parameters/q_param"
      - $ref: "../swagger.yaml#/parameters/q_body"
      - $ref: "../swagger.yaml#/parameters/request_id_header"
    produces:
      - application/json
    responses:
      "200":
        description: A list of library groups
        schema:
          type: array
          items:
            $ref: "../swagger.yaml#/definitions/library_group"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

            * `invalid_query`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        catalogue: "1"
