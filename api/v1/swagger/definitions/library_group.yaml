---
type: object
properties:
  library_group_id:
    type: integer
    description: Internal identifier for the library group
    readOnly: true
  title:
    type:
      - string
      - "null"
    description: Title of the library group
  library_id:
    type:
      - string
      - "null"
    description: Internal identifier of the member library
  description:
    type:
      - string
      - "null"
    description: Longer description of the library group
  parent_id:
    type:
      - integer
      - "null"
