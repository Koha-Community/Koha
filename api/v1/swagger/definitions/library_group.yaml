---
type: object
properties:
  library_group_id:
    type: integer
    description: Internal identifier for the library group
    readOnly: true
  title:
    type:
      - string
      - "null"
    description: Title of the library group
  library_id:
    type:
      - string
      - "null"
    description: Internal identifier of the member library
  description:
    type:
      - string
      - "null"
    description: Longer description of the library group
  parent_id:
    type:
      - integer
      - "null"
    description: Internal identifier of the parent library group
  hide_patron_info:
    type: boolean
    description: If patron information is hidden from staff outside the group
  limit_item_editing:
    type: boolean
    description: If item editing is limited to staff within the group
  limit_report_access:
    type: boolean
    description: If report access is limited to the libraries in the group
  is_opac_search_group:
    type: boolean
    description: If the group is used as an OPAC search group
  is_staff_search_group:
    type: boolean
    description: If the group is used as a staff interface search group
  is_local_hold_group:
    type: boolean
    description: If the group is used as a local hold group
  is_local_float_group:
    type: boolean
    description: If the group is used as a local float group
  is_record_source_editing_group:
    type: boolean
    description: If the group is used for record source editing
  created_on:
    description: Date and time of creation
    type:
      - string
      - "null"
    format: date-time
    readOnly: true
  updated_on:
    description: Date and time of the last update
    type: string
    format: date-time
    readOnly: true
additionalProperties: false
required:
  - library_group_id
  - title
  - hide_patron_info
  - limit_item_editing
  - limit_report_access
  - is_opac_search_group
  - is_staff_search_group
  - is_local_hold_group
  - is_local_float_group
  - is_record_source_editing_group
