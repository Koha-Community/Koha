  is_local_hold_group:
    type: boolean
    description: If the group is used as a local hold group
  is_local_float_group:
    type: boolean
    description: If the group is used as a local float group
  created_on:
    description: date of creation
    type:
      - string
      - "null"
  updated_on:
    description: date of update
    type:
      - string
      - "null"
additionalProperties: false
required:
  - library_group_id
  - title
  - limit_item_editing
  - is_opac_search_group
  - is_staff_search_group
  - is_local_hold_group
  - is_local_float_group
