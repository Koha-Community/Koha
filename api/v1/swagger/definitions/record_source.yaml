---
type: object
properties:
  record_source_id:
    type: integer
    description: Internally assigned record source identifier
    readOnly: true
  name:
    description: Record source name
    type: string
  can_be_edited:
    description: If records from this source can be edited
    type: boolean
  usage_count:
    description: Record source usage count (x-koha-embed)
    type: integer
  library_groups:
    description: Library groups whose member libraries can edit records from this source when locked (x-koha-embed). On update, omit the key to keep the current links or send an empty array to clear them.
    type: array
    items:
      $ref: record_source_library_group.yaml
  is_system:
    description: Is this record source system or not
    type: boolean
additionalProperties: false
required:
  - name
